<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Greet App</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="animation-container" aria-hidden="true"></div>

  <main class="card">
    <h1 class="title">Enter Your Name</h1>
    <form id="greet-form" novalidate>
      <label for="name-input" class="visually-hidden">Enter Your Name</label>
      <input
        type="text"
        id="name-input"
        name="name"
        placeholder="Type your name here"
        autocomplete="name"
        maxlength="100"
      />
      <button type="submit" id="greet-btn">Greet</button>
    </form>
    <p id="greeting-message" class="greeting-message" aria-live="polite" hidden></p>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
